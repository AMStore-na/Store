name: Validazione catalogo macOS

# Parte da sola ogni volta che cambia il catalogo (o questo controllo),
# sia con un commit diretto su GitHub sia con una pull request.
on:
  push:
    paths:
      - 'catalogoMacos.json'
      - 'ScriptPython/ValidaCatalogoMacos.py'
      - '.github/workflows/validazione-catalogo-macos.yml'
  pull_request:
    paths:
      - 'catalogoMacos.json'
      - 'ScriptPython/ValidaCatalogoMacos.py'
      - '.github/workflows/validazione-catalogo-macos.yml'
  workflow_dispatch: # Permette di avviarlo a mano dalla scheda Actions

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      # Python 3 e' gia' installato sulla macchina di GitHub: niente dipendenze.
      - name: Controlla catalogoMacos.json
        run: python3 ScriptPython/ValidaCatalogoMacos.py catalogoMacos.json
